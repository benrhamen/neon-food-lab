.plist{max-height:62vh;overflow-y:auto;scrollbar-width:thin;border:2px solid #c9c9ee;border-radius:10px;padding:4px 8px 8px;background:#f6f6ff}
.groups.jump{position:sticky;top:0;background:#f6f6ff;z-index:3;padding:6px 0 8px;margin:0}
.gsec{margin-bottom:8px;scroll-margin-top:96px}
.ghead{position:sticky;top:42px;background:#f6f6ff;z-index:2;margin:6px 0;padding:2px 0;font-size:14px}
.ghead small{color:#a97a8f;font-weight:400}
.recipe-card{display:flex;gap:10px;align-items:flex-start;border:2px solid #c9c9ee;border-radius:10px;background:#f6f6ff;padding:10px;margin-bottom:8px;text-align:left}
.recipe-card img{flex:none;margin-top:2px}
.recipe-card .recipe-info{flex:1;min-width:0}
.recipe-card p{margin:2px 0}
.recipe-card .chips{margin-top:4px}
.recipe-card .btn{flex:none}
.stepper{display:flex;gap:4px;margin:0 0 8px;position:sticky;top:0;z-index:5;background:#e6e7ff;padding:4px 0}.stp{flex:1;font:inherit;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;padding:2px}.stp b{font-size:14px}.stp.on{background:var(--yel)}.stp.done{background:var(--mint)}.stp.off{opacity:.6;border-style:dashed}.stp:disabled{opacity:.4}
.serve{display:flex;gap:8px}.serve .btn.big{flex:1;width:auto}.btn:disabled{opacity:.5}
.tip.warn{color:#b0304a;font-weight:700}.chip.tiny{font-size:11px;padding:2px 7px;background:#f6f6ff}.sel .chips{margin:4px 0 6px}.sel-head small{margin-left:auto}
.drs-tile{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid #c9c9ee;border-radius:10px;background:#f6f6ff;padding:6px 2px;min-height:96px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}.drs-tile.chosen{border-color:var(--ink);background:#d7f7e6}.drs-tile b{font-size:12px;text-align:center;overflow-wrap:anywhere}.drs-tile img{width:56px;height:56px}
.drs-none{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);min-height:44px;width:100%;margin:6px 0;cursor:pointer}.drs-none.on{background:var(--yel)}.ghead2{margin:10px 0 6px;font-size:14px}
.subhead{font-weight:bold;font-size:12px;color:#805453;letter-spacing:.04em;text-transform:uppercase;padding:4px 2px 0;border-bottom:2px dotted #c9c9ee}.sidecup{position:absolute;right:-6px;bottom:-8px;text-align:center;line-height:1}.sidecup small{display:block;font-size:9px;opacity:.9}.qmark{font-size:28px;font-weight:900;width:44px;text-align:center}.callout .chip{margin-left:4px}

/* Round navigation */
.round-tools{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;justify-content:center;gap:7px;padding:8px 10px;background:#fff7ee;border-bottom:3px solid #805453;box-shadow:0 3px 0 #d6b7a5}
.round-tools button{font:inherit;font-size:12px;font-weight:bold;min-height:38px;padding:8px 12px;background:#fff;border:2px solid #805453;border-radius:8px;color:#503b48}
.game:has(.round-tools){padding-top:68px}.game:has(.round-tools) .sound-toggle{top:64px}.game:has(.round-tools) .stepper{top:58px}#wz-top{scroll-margin-top:65px}
.round-shade{position:fixed;inset:0;background:#302238b3;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.round-dialog{background:#fff7ee;border:4px solid #805453;border-radius:16px;padding:20px;max-width:390px;width:100%;box-shadow:0 7px 0 #302238;max-height:90dvh;overflow:auto;text-align:center}.round-dialog h2{font-size:20px}.round-dialog .btn{display:block;width:100%;margin-top:12px}

.reward-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 13px;background:#fff4ca;border:2px solid #c9a259;border-radius:10px;padding:10px;margin:8px 0 12px;font-size:12px;color:#664621}.reward-strip small{flex-basis:100%;text-align:center;font-size:11px}.reward-note{position:fixed;left:12px;right:12px;bottom:85px;z-index:120;background:#fff4ca;border:3px solid #c9a259;border-radius:12px;padding:14px 36px 14px 14px;text-align:center;font-weight:bold;max-width:480px;margin:auto;box-shadow:0 4px 0 #805453}.reward-note button{position:absolute;right:5px;top:5px;background:none;border:0;font-size:22px;color:#664621}.reward-note.milestone{animation:reward-pop .5s ease-out;background:#ffe68e}@keyframes reward-pop{0%{transform:scale(.75)}65%{transform:scale(1.05)}100%{transform:scale(1)}}
.gold-chef-hat{display:inline-block;position:relative;width:16px;height:12px;background:#f6c64b;border:2px solid #a57b23;border-radius:2px;vertical-align:middle;margin:3px 2px 0 6px}.gold-chef-hat:before{content:"";position:absolute;left:-4px;top:-8px;width:20px;height:10px;background:#ffe38b;border:2px solid #a57b23;border-radius:8px 8px 4px 4px}
/* Desktop and keyboard friendly */
button,.btn,.food-tile,.pitem,.drs-tile{cursor:pointer}
button:focus-visible,.btn:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3a7bd5;outline-offset:2px}
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}.food-tile:hover,.drs-tile:hover,.recipe-card:hover{border-color:var(--ink)}.groups button:hover,.library-tools button:hover,.round-tools button:hover,.stp:hover{background:#fff1b8}}
@media (min-width:900px){
.game{max-width:1040px;padding:16px 28px 90px}
.pantry{grid-template-columns:repeat(6,minmax(0,1fr))}
.plist{max-height:70vh}
.serve,.round-tools{max-width:1040px}
.round-tools{margin:0 auto}
.stepper{max-width:820px;margin-left:auto;margin-right:auto}
.panel{max-width:960px;margin-left:auto;margin-right:auto}
.recipe-card{max-width:900px;margin-left:auto;margin-right:auto}
