m"],tip:"Boiling is gentle and simple, but some vitamins escape into the water."},{id:"simmer",label:"Simmer",tags:["warm","comforting","soft","tasty"],tip:"Slow, gentle bubbles blend flavours into a cosy stew or soup."},{id:"poach",label:"Poach",tags:["light","healthy","soft"],tip:"Poaching in barely trembling water keeps delicate food silky without any oil."},{id:"saute",label:"Saute",tags:["tasty","warm"],tip:"Quick cooking in a little hot oil, tossing often, for bright colour and flavour."},{id:"fry",label:"Fry",tags:["crunchy","tasty","hearty","oily"],tip:"Hot oil makes a crisp golden crust, but adds fat and calories."},{id:"grill",label:"Grill",tags:["smoky","tasty","hearty"],tip:"Direct heat browns the surface (the Maillard reaction) for smoky, savoury flavour."},{id:"roast",label:"Roast",tags:["warm","sweet","tasty"],tip:"Dry oven heat caramelises natural sugars, so veggies taste sweeter."},{id:"bake",label:"Bake",tags:["warm","hearty"],tip:"Even oven heat cooks food through and gives a golden top."},{id:"smoke",label:"Smoke",tags:["smoky","tasty"],tip:"Smoke adds aroma, but cold smoking is not a cooking or safety step. Raw animal foods need safe cooking."}],D=(e,t,a,l,s,n,i,f)=>({id:e,name:t,color:a,group:l,tags:s,great:n,bad:i,fact:f}),Ve=[D("tomato","Tomato","red","Veggie",["fresh","tasty"],["roast","simmer"],["poach"],"Tomatoes contain lycopene, an antioxidant your body absorbs better when they are cooked."),D("carrot","Carrot","orange","Veggie",["sweet","crunchy","healthy"],["roast","steam"],["poach"],"Carrots are rich in beta-carotene, which your body turns into vitamin A for healthy eyes. A little oil helps you absorb it."),D("broccoli","Broccoli","green","Veggie",["healthy","fresh"],["steam","saute"],["smoke","poach"],"Broccoli is full of vitamin C. Steaming keeps more of it than boiling, which lets vitamins leak into the water."),D("egg","Egg","yellow","Protein",["protein","creamy"],["poach","boil","fry"],["raw"],"Eggs hold all the essential amino a
